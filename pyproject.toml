[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitrec"
version = "0.1.0"
description = "Git History Organization & Jira Backfill Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "flask>=3.0.0",
    "pytest>=7.0.0"
]

[project.scripts]
gitrec = "gitrec.cli:cli"
